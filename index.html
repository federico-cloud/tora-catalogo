<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TORA</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <!-- LOGO -->
      <div class="logo-group">
        <h1 class="logo">TORA</h1>
        <p class="logo-tagline">AMA TU CUERPO POR LO QUE ES CAPAZ DE HACER</p>
      </div>

      <!-- ACTIVIDADES -->
      <div class="seccion">
        <img
          class="seccion__imagen"
          src="assets/actividades.jpeg"
          alt="Actividades"
          data-index="0"
        />
      </div>

      <!-- HORARIOS -->
      <div class="seccion">
        <img
          class="seccion__imagen"
          src="assets/horarios.jpeg"
          alt="Horarios"
          data-index="1"
        />
      </div>

      <!-- ABONOS -->
      <div class="seccion">
        <img
          class="seccion__imagen"
          src="assets/abonos.jpeg"
          alt="Abonos"
          data-index="2"
        />
      </div>
    </div>
    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox__close" id="lb-close">&#x2715;</button>
      <img class="lightbox__img" id="lb-img" src="" alt="" />
    </div>
    <a
      class="whatsapp-float"
      href="https://wa.me/5491135861290"
      target="_blank"
      rel="noopener"
    >
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
        />
      </svg>
    </a>
    <script>
      const images = [
        { src: "assets/actividades.jpeg", alt: "Actividades" },
        { src: "assets/horarios.jpeg", alt: "Horarios" },
        { src: "assets/abonos.jpeg", alt: "Abonos" },
      ];

      let current = 0;
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");

      function open(index) {
        current = index;
        lbImg.src = images[current].src;
        lbImg.alt = images[current].alt;
        lightbox.classList.add("lightbox--active");
      }

      function close() {
        lightbox.classList.remove("lightbox--active");
      }

      document.querySelectorAll(".seccion__imagen").forEach((img) => {
        img.addEventListener("click", () => open(Number(img.dataset.index)));
      });

      document.getElementById("lb-close").addEventListener("click", close);

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) close();
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("lightbox--active")) return;
        if (e.key === "Escape") close();
      });
    </script>
  </body>
</html>
