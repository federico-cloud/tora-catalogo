<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TORA — Red de Beneficios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/beneficios/styles.css" />
  </head>
  <body>
    <!-- ══ HERO ══════════════════════════════════════════════ -->
    <section class="hero">
      <div class="hero-content">
        <div class="hero-title">RED TORA</div>
        <!-- <div class="hero-subtitle">RED DE BENEFICIOS</div> -->
        <div class="hero-tagline">MARCAS QUE ACOMPAÑAN A NUESTRA COMUNIDAD</div>
      </div>
    </section>

    <!-- ══ FILTERS ════════════════════════════════════════════ -->
    <nav class="filters" aria-label="Categorías">
      <button class="filter-btn active" data-filter="todas">Todas</button>
      <button class="filter-btn" data-filter="gastronomia">Gastronomía</button>
      <button class="filter-btn" data-filter="hogar">Hogar</button>
      <button class="filter-btn" data-filter="indumentaria">
        Indumentaria
      </button>
    </nav>

    <!-- ══ BENEFITS GRID ══════════════════════════════════════ -->
    <section class="benefits-section">
      <div class="benefits-grid" id="grid">
        <!-- ── Card 1: BaGreen ──────────────────────────── -->
        <article class="card" data-category="gastronomia">
          <span class="tora-badge">Gastronomía</span>
          <img src="../assets/bagreen.jpeg" alt="BaGreen — Beneficio TORA" />
        </article>

        <!-- ── Card 2: Panera Rosa ───────────────────────── -->
        <article class="card" data-category="gastronomia">
          <span class="tora-badge">Gastronomía</span>
          <img
            src="../assets/panerarosa.jpeg"
            alt="Panera Rosa — Beneficio TORA"
          />
        </article>

        <!-- ── Card 3: Vera del Río ──────────────────────── -->
        <article class="card" data-category="gastronomia">
          <span class="tora-badge">Gastronomía</span>
          <img
            src="../assets/veradelrio.jpeg"
            alt="Vera del Río — Beneficio TORA"
          />
        </article>

        <!-- ── Card 4: Erisa ─────────────────────────────── -->
        <article class="card" data-category="indumentaria">
          <span class="tora-badge">Indumentaria</span>
          <img src="../assets/erisa.jpeg" alt="Erisa — Beneficio TORA" />
        </article>

        <!-- ── Card 5: Hilachada ─────────────────────────── -->
        <article class="card" data-category="hogar">
          <span class="tora-badge">Hogar</span>
          <img src="../assets/hilachada.jpeg" alt="Hilachada — Beneficio TORA" />
        </article>

        <!-- ── Card 6: Honua ─────────────────────────────── -->
        <article class="card" data-category="hogar">
          <span class="tora-badge">Hogar</span>
          <img src="../assets/honua.jpeg" alt="Honua — Beneficio TORA" />
        </article>
      </div>
    </section>

    <!-- ══ LIGHTBOX ══════════════════════════════════════════ -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
      <button class="lightbox-close" id="lb-close" aria-label="Cerrar">&times;</button>
      <button class="lb-nav" id="lb-prev" aria-label="Anterior">&#8249;</button>
      <img id="lb-img" src="" alt="" />
      <button class="lb-nav" id="lb-next" aria-label="Siguiente">&#8250;</button>
    </div>

    <script>
      // ── Filters ──────────────────────────────────────────
      const buttons = document.querySelectorAll(".filter-btn");
      const cards = document.querySelectorAll(".card");

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const filter = btn.dataset.filter;
          cards.forEach((card) => {
            const match =
              filter === "todas" || card.dataset.category === filter;
            card.classList.toggle("hidden", !match);
          });
        });
      });

      // ── Lightbox ─────────────────────────────────────────
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");
      const lbClose = document.getElementById("lb-close");
      const lbPrev = document.getElementById("lb-prev");
      const lbNext = document.getElementById("lb-next");

      let currentIndex = 0;

      function visibleCards() {
        return [...cards].filter((c) => !c.classList.contains("hidden"));
      }

      function openLightbox(index) {
        const visible = visibleCards();
        currentIndex = index;
        const img = visible[currentIndex].querySelector("img");
        lbImg.src = img.src;
        lbImg.alt = img.alt;
        lbPrev.disabled = currentIndex === 0;
        lbNext.disabled = currentIndex === visible.length - 1;
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("open");
        document.body.style.overflow = "";
      }

      cards.forEach((card) => {
        card.addEventListener("click", () => {
          const visible = visibleCards();
          openLightbox(visible.indexOf(card));
        });
      });

      lbPrev.addEventListener("click", (e) => {
        e.stopPropagation();
        if (currentIndex > 0) openLightbox(currentIndex - 1);
      });

      lbNext.addEventListener("click", (e) => {
        e.stopPropagation();
        if (currentIndex < visibleCards().length - 1) openLightbox(currentIndex + 1);
      });

      lbClose.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft" && lightbox.classList.contains("open")) lbPrev.click();
        if (e.key === "ArrowRight" && lightbox.classList.contains("open")) lbNext.click();
      });
    </script>
  </body>
</html>
